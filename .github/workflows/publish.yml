name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-24.04
    environment: publish
    permissions:
      contents: read
      # OIDC token for npm trusted publishing. This replaces the NPM_TOKEN
      # secret entirely — no access token is stored in the repo.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      # Deliberately no `registry-url`: setup-node would write a placeholder
      # _authToken into .npmrc that blocks the OIDC token exchange.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upgrade npm (trusted publishing needs npm >= 11.5)
        run: npm install -g npm@latest

      - name: Publish
        run: npm publish --access public
